name: Sync GitHub Forks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: delta10
          permission-contents: write

      - name: Sync forks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e

          gh repo sync delta10/open-inwoner --branch develop
          gh repo sync delta10/open-formulieren --branch main
          gh repo sync delta10/open-forms-sdk --branch main
          gh repo sync delta10/signalen-frontend --branch main
          gh repo sync delta10/signalen-backend --branch main
